<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlot — Series</title>
<link rel="stylesheet" href="/ui/board.css">
<link rel="stylesheet" href="/ui/gallery.css">
<link rel="stylesheet" href="/ui/backlog.css">
<link rel="stylesheet" href="/ui/series.css">
</head>
<body>
<div class="wrap">
  <header class="slate">
    <div class="clapper"></div>
    <div>
      <span class="wordmark">Backlot</span>
      <h1>Series</h1>
    </div>
    <span class="chip" id="count"></span>
    <nav class="g-nav">
      <a href="/">Library</a>
      <a href="/backlog">Backlog</a>
      <a href="/series" aria-current="page">Series</a>
      <a href="/insights">Insights</a>
      <a href="/gallery">Gallery</a>
      <a href="/images">Images</a>
      <a href="/characters">Characters</a>
      <a href="/products">Products</a>
    </nav>
    <div class="spacer"></div>
  </header>

  <div class="g-layout">
    <section class="g-list" aria-label="Danh sách series">
      <div class="g-actions" style="margin:0 0 12px">
        <button class="g-btn primary" type="button" id="newBtn">+ Series mới</button>
      </div>
      <div id="list"></div>
      <p class="hint" id="empty" style="display:none">Chưa có series nào. Bấm “+ Series mới” để tạo, wiki sẽ có sẵn các trang mẫu.</p>
    </section>
    <section class="g-detail" id="detail" aria-live="polite">
      <p class="hint">Chọn một series ở bên trái.</p>
    </section>
  </div>
</div>
<script type="module" src="/ui/series.js"></script>
</body>
</html>
