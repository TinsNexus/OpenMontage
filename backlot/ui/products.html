<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlot — Products</title>
<link rel="stylesheet" href="/ui/board.css">
<link rel="stylesheet" href="/ui/gallery.css">
</head>
<body>
<div class="wrap">
  <header class="slate">
    <div class="clapper"></div>
    <div>
      <span class="wordmark">Backlot</span>
      <h1>Products</h1>
    </div>
    <span class="chip" id="count"></span>
    <nav class="g-nav">
      <a href="/gallery">Gallery</a>
      <a href="/">Library</a>
      <a href="/backlog">Backlog</a>
      <a href="/series">Series</a>
      <a href="/insights">Insights</a>
      <a href="/images">Images</a>
      <a href="/characters">Characters</a>
      <a href="/swap">Thay nhân vật</a>
      <a href="/products" aria-current="page">Products</a>
      <a href="/formulas">Formulas</a>
    </nav>
    <div class="spacer"></div>
  </header>

  <div class="g-layout">
    <section class="g-list" aria-label="Danh sách sản phẩm">
      <div class="g-actions" style="margin:0 0 12px">
        <button class="g-btn primary" type="button" id="newBtn">+ Sản phẩm mới</button>
      </div>
      <div class="g-filter"><input id="filter" type="search" placeholder="Tìm sản phẩm…" aria-label="Tìm sản phẩm"></div>
      <div id="list"></div>
      <p class="hint" id="empty" style="display:none">Chưa có sản phẩm nào. Bấm “+ Sản phẩm mới”, dán link affiliate Shopee và tải ảnh sản phẩm lên.</p>
    </section>
    <section class="g-detail" id="detail" aria-live="polite">
      <p class="hint">Chọn một sản phẩm ở bên trái.</p>
    </section>
  </div>
</div>
<script type="module" src="/ui/products.js"></script>
</body>
</html>
