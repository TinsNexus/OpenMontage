<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlot — Thay nhân vật</title>
<link rel="stylesheet" href="/ui/board.css">
<link rel="stylesheet" href="/ui/gallery.css">
<link rel="stylesheet" href="/ui/swap.css">
</head>
<body>
<div class="wrap">
  <header class="slate">
    <div class="clapper"></div>
    <div>
      <span class="wordmark">Backlot</span>
      <h1>Thay nhân vật</h1>
    </div>
    <span class="chip" id="count"></span>
    <nav class="g-nav">
      <a href="/gallery">Gallery</a>
      <a href="/">Library</a>
      <a href="/backlog">Backlog</a>
      <a href="/series">Series</a>
      <a href="/tutien">Tu Tiên</a>
      <a href="/insights">Insights</a>
      <a href="/images">Images</a>
      <a href="/characters">Characters</a>
      <a href="/swap" aria-current="page">Thay nhân vật</a>
      <a href="/products">Products</a>
      <a href="/formulas">Formulas</a>
    </nav>
    <div class="spacer"></div>
  </header>

  <div class="g-layout">
    <section class="g-list" aria-label="Danh sách lượt thay">
      <form class="sw-new" id="newForm">
        <input type="text" id="newTitle" placeholder="Tên lượt thay (vd: NOVA chạy xe)" aria-label="Tên lượt thay" maxlength="80">
        <button class="g-btn primary" type="submit">+ Tạo</button>
      </form>
      <div id="list"></div>
      <p class="hint" id="empty" style="display:none">Chưa có lượt thay nào. Đặt tên rồi bấm “+ Tạo”.</p>
    </section>
    <section class="g-detail" id="detail" aria-live="polite">
      <p class="hint">Chọn hoặc tạo một lượt thay ở bên trái.</p>
    </section>
  </div>
</div>
<script type="module" src="/ui/swap.js"></script>
</body>
</html>
