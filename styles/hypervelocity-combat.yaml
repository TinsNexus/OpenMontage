identity:
  name: "Hypervelocity Combat"
  category: cinematic
  mood: affectionate, protective rage, explosive, kinetic, tender payoff
  pace: rapid
  best_for: >
    Short photoreal martial-arts videos (15-20s, 16:9 or 9:16) where a library character
    protects a noncombatant partner from a gang: nonstop combinations, two micro slow-mos,
    gentle reunion. Full prompt recipe: skills/creative/prompting/seedance-fight-formula.md.
    Worked example: projects/mia-arcade-fight.

visual_language:
  color_palette:
    primary: ["#FF4FB3", "#7A5CFF"]        # neon pink, violet
    accent: ["#3FA9FF", "#FFFFFF"]         # cool blue neon, practical whites
    background: "#0B0B14"                  # dark ceiling / shadows
    text: "#FFFFFF"                        # subtitles
    muted: "#4A4F63"                       # floor carpet, metal
  composition: >
    Fixed spatial map held across every shot: LEFT set piece (partner hides here), CENTER
    open aisle for the fight, RIGHT set piece, REAR counter. Wide lenses (21-28mm) low for
    pursuit, 35mm over-shoulder for combinations, 50mm through glass for the intro,
    35mm medium close-up for the reunion.
  texture: >
    Photorealistic 35mm film grain, natural motion blur on strikes, real skin pores and fabric,
    neon halation; never 3D, cartoon or VFX-looking.

typography:
  headings:
    font: "Arial"
    weight: 700
  body:
    font: "Arial"
    weight: 700
    line_height: 1.2
  scale_system: "minor_third"
  weight_matrix:
    title: 700
    heading: 700
    body: 700
    caption: 700

motion:
  transitions: [hard_cut, whip_pan, snap_pan]
  animation_style: >
    Reactive handheld, action-first, camera 0.1-0.3s late with overshoot -> whip-pan ->
    reacquire. Foot plant -> compression -> explosive push-off -> real contact -> replant.
    Superhuman acceleration with realistic physics; no teleport, aura, afterimages or floating.
  pacing_rules:
    min_scene_hold_seconds: 1.5
    max_scene_hold_seconds: 2.5
    text_card_hold_seconds: 1.5
    stat_card_hold_seconds: 1.5
    transition_duration_seconds: 0.1
  entrance: "none — cut straight into motion"
  exit: "hard cut on impact or whip-pan"

audio:
  voice_style: "native-language in-scene dialogue generated by Seedance, lines of 6 words or fewer, English burned-in subtitles"
  music_mood: "none — no music"
  music_volume: 0.0
  sfx_style: "raw diegetic only: punches, body hits, footsteps, falls, location ambience"
  ducking_threshold_db: 0

asset_generation:
  image_prompt_prefix: >
    Montage, multi-shot live-action action film, photorealistic, 35mm film grain, motion blur
    on fast actions, reactive handheld camera 0.1-0.3s late with overshoot and whip-pans,
    no 3D, no cartoon, no VFX aesthetic, real skin and fabric texture.
  image_negative_prompt: "cartoon, anime, 3D render, CGI, glow aura, afterimages, floating, blood, gore, clones, extra limbs"
  consistency_anchors:
    - "ONE hero, ONE noncombatant partner, FIVE adult male enemies, each enemy with a distinctive hair + top"
    - "Hero and partner come from the character library (characters: [hero, partner]) so faces stay locked"
    - "Same location map in every shot: partner stays LEFT, fight in CENTER aisle"
    - "One prop dropped in clip 1 and handed back in the final shot"
    - "Exactly two impact slow-mos (0.25s and 0.2s), one per 10s clip"
    - "Defeated enemies never get up; clip 2 is written from clip 1's actual last frame"

quality_rules:
  - "Generate with seedance_piapi reference_to_video, model_variant standard + less_restriction (2.5 is moderation-blocked on photoreal fights)"
  - "20s = two 10s clips at 720p; clip 2 adds clip 1's last frame as an extra reference image"
  - "Watch clip 1's last frame before writing clip 2 and describe who is standing/down exactly as shown"
  - "Each 2s beat names lens, angle, attacker and a 3-6 strike combination; no neutral resets"
  - "Dialogue lines 6 words or fewer; hero's real name in the lines"
  - "No blood, no gore, no music; all characters adults"
  - "Meta policy: end every clip prompt with the SAFETY line from skills/creative/prompting/meta-safety-rules.md (weapons never touch skin, no hits on downed/held people, defeated enemies visibly alive); turn on the AI label when posting"
  - "Burn English subtitles from whisper timings; keep an .srt next to the assets"

taste_profile:
  design_read: "Japanese live-action action short, viral-clip energy"
  visual_variance: 3
  motion_intensity: 10
  information_density: 2
